name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check src/ tests/ data/

      - name: Check formatting with black
        run: black --check src/ tests/ data/

      - name: Run unit tests
        run: pytest tests/ -v

      - name: Regenerate sample data
        run: python data/generate_sample_data.py

      - name: Smoke-test mall segmentation pipeline
        run: python src/mall_segmentation.py

      - name: Smoke-test sales prediction pipeline
        run: python src/bigmart_sales_prediction.py

      - name: Upload generated artifacts
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: outputs
          path: outputs/
